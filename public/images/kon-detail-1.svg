    <line x1="540" y1="145" x2="880" y2="145" stroke="#26211a" stroke-width="1" />
    <text x="540" y="175" font-family="monospace" font-size="10" fill="#695f51">PROVENANCE: YUNGAS FORAGED FLORA</text>
    <text x="540" y="195" font-family="monospace" font-size="10" fill="#695f51">PAIRING: PINOT NOIR UNFILTERED 2019</text>
