      <stop offset="0%" stop-color="#11100e" />
      <stop offset="100%" stop-color="#0a0907" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-kon-d1)" />

  <!-- Course Card Schematics -->
  <g transform="translate(140, 140)">
