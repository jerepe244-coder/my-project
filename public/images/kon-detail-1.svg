    <rect x="0" y="0" width="420" height="480" fill="#161411" stroke="#2a251e" stroke-width="1.5" />
    <text x="40" y="55" font-family="monospace" font-size="11" fill="#0a5cff" letter-spacing="1">SERVICE 01 — ACT I</text>
    <text x="40" y="85" font-family="sans-serif" font-size="20" font-weight="bold" fill="#eae4db">Cold-Smoked Trout Caviar</text>
