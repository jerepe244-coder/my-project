    <line x1="40" y1="145" x2="380" y2="145" stroke="#26211a" stroke-width="1" />
    <text x="40" y="175" font-family="monospace" font-size="10" fill="#695f51">PROVENANCE: PATAGONIA LAKE DISTRICT</text>
