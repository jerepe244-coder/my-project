<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="soma-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0d1015" />
      <stop offset="100%" stop-color="#060708" />
    </linearGradient>

    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0a5cff" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#c89d58" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07080a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bottle-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="25%" stop-color="#242c3a" />
      <stop offset="50%" stop-color="#10131a" />
      <stop offset="85%" stop-color="#2a3344" />
      <stop offset="100%" stop-color="#12151d" />
    </linearGradient>

    <linearGradient id="liquid-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b4f" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#8f5d22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#4a2e0e" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pipette-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e2c4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a5cff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="800" fill="url(#soma-bg)" />

  <!-- Ambient Light Center -->
  <circle cx="600" cy="400" r="380" fill="url(#ambient-glow)" />

  <!-- Architectural & Lab Grid Lines -->
  <g stroke="#1a202c" stroke-width="0.75" stroke-dasharray="3,9" opacity="0.6">
    <line x1="120" y1="0" x2="120" y2="800" />
    <line x1="1080" y1="0" x2="1080" y2="800" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="680" x2="1200" y2="680" />
    <line x1="600" y1="60" x2="600" y2="740" />
  </g>

  <!-- Technical Lab Crosshairs -->
  <g stroke="#2f394d" stroke-width="1" opacity="0.8">
    <line x1="590" y1="400" x2="610" y2="400" />
    <line x1="600" y1="390" x2="600" y2="410" />
    <line x1="110" y1="120" x2="130" y2="120" />
    <line x1="120" y1="110" x2="120" y2="130" />
    <line x1="1070" y1="120" x2="1090" y2="120" />
    <line x1="1080" y1="110" x2="1080" y2="130" />
  </g>

  <!-- Specimen Central Bottle Construction -->
  <g transform="translate(600, 420)">
    <!-- Shadow under bottle -->
    <ellipse cx="0" cy="240" rx="140" ry="24" fill="#000000" opacity="0.6" />

    <!-- Bottle Body (Biophotonic Miron Glass Monolith) -->
    <rect x="-110" y="-80" width="220" height="310" rx="28" fill="url(#bottle-glass)" stroke="#2b3548" stroke-width="1.5" />

    <!-- Internal Amber Serum Level Silhouette -->
    <rect x="-98" y="-10" width="196" height="230" rx="16" fill="url(#liquid-amber)" opacity="0.4" />

    <!-- Glass Refraction Vertical Lines -->
    <line x1="-80" y1="-70" x2="-80" y2="210" stroke="#485672" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="80" y1="-70" x2="80" y2="210" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

    <!-- Paper Texture Studio Label Plate -->
    <rect x="-75" y="20" width="150" height="150" fill="#0b0e13" stroke="#252d3d" stroke-width="1" />
    <rect x="-70" y="25" width="140" height="140" fill="none" stroke="#1d2330" stroke-width="0.75" />

    <text x="0" y="55" fill="#f4f5f8" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="4" text-anchor="middle">SŌMA</text>
    <text x="0" y="75" fill="#0a5cff" font-family="monospace" font-size="8" letter-spacing="2" text-anchor="middle">FORMULATION 01</text>
    <line x1="-40" y1="90" x2="40" y2="90" stroke="#232a38" stroke-width="1" />
    <text x="0" y="110" fill="#8b92a5" font-family="sans-serif" font-size="8" letter-spacing="1" text-anchor="middle">CELLULAR NECTAR</text>
    <text x="0" y="130" fill="#515768" font-family="monospace" font-size="7" letter-spacing="1.5" text-anchor="middle">30 ML / 1.01 FL. OZ.</text>
    <text x="0" y="150" fill="#0a5cff" font-family="monospace" font-size="6" letter-spacing="1" text-anchor="middle">MIRON GLASS // 2025</text>

    <!-- Bottle Neck -->
    <rect x="-42" y="-130" width="84" height="52" fill="#181d26" stroke="#2b3548" stroke-width="1.25" />
    <!-- Collar Ring -->
    <rect x="-48" y="-120" width="96" height="12" rx="3" fill="#202735" stroke="#37435b" stroke-width="1" />

    <!-- Dropper Cap (Rubber bulb & fluted rim) -->
    <path d="M-36,-130 L-32,-190 Q-30,-215 0,-215 Q30,-215 32,-190 L36,-130 Z" fill="#13161c" stroke="#2a3344" stroke-width="1.25" />

    <!-- Suspended Pipette Active Droplet -->
    <line x1="0" y1="-80" x2="0" y2="10" stroke="url(#pipette-glow)" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="16" r="4.5" fill="#d49b4f" stroke="#0a5cff" stroke-width="1" />
  </g>

  <!-- Editorial Top Metadata -->
  <g font-family="monospace" font-size="11" fill="#8b92a5">
    <text x="140" y="90" letter-spacing="2">// SŌMA FORMULATIONS</text>
    <text x="140" y="108" fill="#515768" font-size="9" letter-spacing="1">PROJECT SPECIMEN // BEAUTY &amp; E-COMMERCE</text>

    <text x="1060" y="90" text-anchor="end" letter-spacing="2">SERIES 2025</text>
    <text x="1060" y="108" fill="#0a5cff" font-size="9" text-anchor="end" letter-spacing="1">PURE BIOACTIVE MATRIX</text>
  </g>

  <!-- Molecular Structure Inset (Right) -->
  <g transform="translate(950, 420)" stroke="#263144" stroke-width="1" fill="none">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" />
    <polygon points="0,-40 0,40" stroke-dasharray="2,4" />
    <circle cx="0" cy="-40" r="3" fill="#0a5cff" />
    <circle cx="34.6" cy="20" r="3" fill="#c89d58" />
    <circle cx="-34.6" cy="20" r="3" fill="#8b92a5" />
    <text x="0" y="65" fill="#515768" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle">PEPTIDE LINKAGE</text>
  </g>

  <!-- Technical Bottom Spec Coordinates -->
  <g font-family="monospace" font-size="10" fill="#515768">
    <text x="140" y="720">// PHYTO-SQUALANE 100%</text>
    <text x="140" y="736">PATAGONIAN COLD EXTRACTION</text>
    <text x="600" y="728" text-anchor="middle" fill="#0a5cff">[ SENSORY E-COMMERCE CORE ]</text>
    <text x="1060" y="720" text-anchor="end">// 04 BEAUTY &amp; COMMERCE</text>
    <text x="1060" y="736" text-anchor="end">ZYRVAE LAB CONCEPT</text>
  </g>
</svg>
