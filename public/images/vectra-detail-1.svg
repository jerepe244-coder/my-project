<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-v-d1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-v-d1)" />

  <!-- Technical Cross-Section Drawing -->
  <g stroke="#374151" stroke-width="1.5">
    <!-- Ground line -->
    <line x1="80" y1="580" x2="1120" y2="580" stroke="#0a5cff" stroke-width="2" />
    
    <!-- Foundation -->
    <rect x="220" y="580" width="140" height="80" fill="#111827" />
    <rect x="520" y="580" width="140" height="80" fill="#111827" />
    <rect x="820" y="580" width="140" height="80" fill="#111827" />

    <!-- Floor levels -->
    <line x1="200" y1="460" x2="980" y2="460" stroke-dasharray="6,4" />
    <line x1="200" y1="340" x2="980" y2="340" stroke-dasharray="6,4" />
    <line x1="200" y1="220" x2="980" y2="220" stroke-dasharray="6,4" />

    <!-- Exterior walls -->
    <line x1="220" y1="580" x2="220" y2="200" stroke="#9ca3af" stroke-width="2.5" />
    <line x1="960" y1="580" x2="960" y2="200" stroke="#9ca3af" stroke-width="2.5" />
    <line x1="200" y1="200" x2="980" y2="200" stroke="#9ca3af" stroke-width="3" />
  </g>

  <!-- Technical Annotations -->
  <g font-family="monospace" font-size="11" fill="#94a3b8" letter-spacing="1">
    <text x="80" y="120">LONGITUDINAL SECTION AA-01 // SCALE 1:200</text>
    <text x="1000" y="225" fill="#0a5cff">ROOF +36.00M</text>
    <text x="1000" y="345" fill="#64748b">LEVEL 02 +24.00M</text>
    <text x="1000" y="465" fill="#64748b">LEVEL 01 +12.00M</text>
    <text x="1000" y="585" fill="#0a5cff">DATUM ±0.00M</text>
  </g>
</svg>
