<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vectra-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090c" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#06080b" />
    </linearGradient>

    <!-- Raw Board-Formed Concrete Shading -->
    <linearGradient id="concrete-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="100%" stop-color="#19202b" />
    </linearGradient>

    <linearGradient id="concrete-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2633" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>

    <linearGradient id="concrete-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b485d" />
      <stop offset="100%" stop-color="#252f3f" />
    </linearGradient>

    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161e2a" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1" fill="#222d3e" />
    </pattern>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="1200" height="800" fill="url(#vectra-canvas)" />
  <rect width="1200" height="800" fill="url(#arch-grid)" />

  <!-- Monolithic Brutalist Civic Archive & Pavilion -->
  <g transform="translate(600, 420)">
    <!-- Sub-grade podium foundation -->
    <polygon points="-380,140 0,250 380,140 0,30" fill="#090c10" stroke="#1f2735" stroke-width="1.5" />

    <!-- West Monolith (Primary Tower) -->
    <polygon points="-240,100 -90,145 -90,-220 -240,-265" fill="url(#concrete-dark)" stroke="#323e52" stroke-width="1.5" />
    <polygon points="-90,145 60,100 60,-265 -90,-220" fill="url(#concrete-light)" stroke="#323e52" stroke-width="1.5" />
    <polygon points="-240,-265 -90,-220 60,-265 -90,-310" fill="url(#concrete-top)" stroke="#0a5cff" stroke-width="1.5" />

    <!-- Vertical Board-Form Striations on Main Monolith -->
    <line x1="-190" y1="115" x2="-190" y2="-250" stroke="#161c26" stroke-width="1" />
    <line x1="-140" y1="130" x2="-140" y2="-235" stroke="#161c26" stroke-width="1" />
    <line x1="-40" y1="130" x2="-40" y2="-235" stroke="#252f3f" stroke-width="1" />
    <line x1="10" y1="115" x2="10" y2="-250" stroke="#252f3f" stroke-width="1" />

    <!-- East Monolith (Secondary Cantilever Archive) -->
    <polygon points="90,90 230,50 230,-150 90,-110" fill="url(#concrete-dark)" stroke="#2b3547" stroke-width="1.5" />
    <polygon points="230,50 340,80 340,-120 230,-150" fill="url(#concrete-light)" stroke="#2b3547" stroke-width="1.5" />
    <polygon points="90,-110 230,-150 340,-120 200,-80" fill="url(#concrete-top)" stroke="#2b3547" stroke-width="1.5" />

    <!-- Tectonic Suspended Glass & Steel Skybridge -->
    <polygon points="-40,-50 140,-100 140,-65 -40,-15" fill="#0a5cff" fill-opacity="0.22" stroke="#0a5cff" stroke-width="1.5" />
    <line x1="50" y1="-75" x2="50" y2="-40" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6" />

    <!-- Dimension Datum Marks & Elevation Ticks -->
    <line x1="-280" y1="100" x2="-280" y2="-265" stroke="#0a5cff" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="-290" y1="100" x2="-270" y2="100" stroke="#0a5cff" stroke-width="1.25" />
    <line x1="-290" y1="-265" x2="-270" y2="-265" stroke="#0a5cff" stroke-width="1.25" />
    <text x="-300" y="-80" font-family="monospace" font-size="11" fill="#0a5cff" text-anchor="end">+108.5M</text>

    <!-- Base axis coordinate crosshair -->
    <g stroke="#0a5cff" stroke-width="1" opacity="0.8">
      <circle cx="0" cy="250" r="4" fill="none" />
      <line x1="-12" y1="250" x2="12" y2="250" />
      <line x1="0" y1="238" x2="0" y2="262" />
    </g>
  </g>

  <!-- Editorial Architectural Metadata -->
  <g font-family="monospace" font-size="11" fill="#8d9eb5" letter-spacing="2">
    <text x="64" y="68">VECTRA ARCHITECTS // MONOLITH 04</text>
    <text x="64" y="88" fill="#4d5a6b">BRUTALIST ARCHIVE &amp; SPATIAL RESEARCH PRACTICE</text>
    <text x="1136" y="68" text-anchor="end" fill="#f4f5f8">CASE STUDY 03</text>
    <text x="1136" y="88" text-anchor="end" fill="#0a5cff">// CONCEPT</text>
  </g>

  <!-- Bottom Material & Specification Schedule -->
  <g font-family="monospace" font-size="10" fill="#4d5a6b" letter-spacing="1.5">
    <text x="64" y="736">MATERIALS: HYDRAULIC CONCRETE, WEATHERED COR-TEN STEEL &amp; STRUCTURAL SILICA</text>
    <text x="1136" y="736" text-anchor="end" fill="#8d9eb5">ZYRVAE DIGITAL STUDIO</text>
  </g>
</svg>