<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vectra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0e" />
      <stop offset="100%" stop-color="#12161c" />
    </linearGradient>
    <linearGradient id="monolith-face1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242a35" />
      <stop offset="100%" stop-color="#171b22" />
    </linearGradient>
    <linearGradient id="monolith-face2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313948" />
      <stop offset="100%" stop-color="#1e242f" />
    </linearGradient>
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#252c38" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-vectra)" />
  <rect width="1200" height="800" fill="url(#arch-grid)" opacity="0.6" />

  <!-- Monolithic Isometric Building Projection -->
  <g transform="translate(600, 420)">
    <!-- Base podium -->
    <polygon points="-360,120 0,220 360,120 0,20" fill="#14171e" stroke="#2c3444" stroke-width="1.5" />
    
    <!-- Left Tower -->
    <polygon points="-240,80 -100,120 -100,-220 -240,-260" fill="url(#monolith-face1)" stroke="#394459" stroke-width="1.5" />
    <polygon points="-100,120 40,80 40,-260 -100,-220" fill="url(#monolith-face2)" stroke="#394459" stroke-width="1.5" />
    <polygon points="-240,-260 -100,-220 40,-260 -100,-300" fill="#3d495f" stroke="#0a5cff" stroke-width="1.5" />

    <!-- Right Tower / Bridge -->
    <polygon points="60,80 200,40 200,-160 60,-120" fill="url(#monolith-face1)" stroke="#394459" stroke-width="1.5" />
    <polygon points="200,40 320,70 320,-130 200,-160" fill="url(#monolith-face2)" stroke="#394459" stroke-width="1.5" />
    <polygon points="60,-120 200,-160 320,-130 180,-90" fill="#323c4e" stroke="#2c3545" stroke-width="1.5" />

    <!-- Structural cantilever bridge connecting them -->
    <polygon points="-60,-60 120,-110 120,-80 -60,-30" fill="#0a5cff" fill-opacity="0.25" stroke="#0a5cff" stroke-width="1.5" />

    <!-- Measurement lines & datum marks -->
    <line x1="-270" y1="80" x2="-270" y2="-260" stroke="#0a5cff" stroke-width="1" stroke-dasharray="3,3" />
    <text x="-285" y="-90" font-family="monospace" font-size="10" fill="#0a5cff" text-anchor="end">+112.4M</text>
  </g>

  <!-- Headers & Metadata -->
  <g font-family="monospace" font-size="11" fill="#7d8ba1" letter-spacing="2">
    <text x="60" y="70">VECTRA ARCHITECTS // MONOLITH 04</text>
    <text x="60" y="90" fill="#465163">BRUTALIST PAVILION &amp; CIVIC ARCHIVE</text>
    <text x="1140" y="70" text-anchor="end">TECTONIC PRACTICE</text>
    <text x="1140" y="90" text-anchor="end" fill="#0a5cff">STATUS: CONCEPT</text>
  </g>

  <g font-family="monospace" font-size="10" fill="#5c697e" letter-spacing="1">
    <text x="60" y="730">PROJECT V-8891 // 14,200 M² REINFORCED BOARD-FORMED CONCRETE</text>
    <text x="1140" y="730" text-anchor="end">ZYRVAE CASE STUDY</text>
  </g>
</svg>
