<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kon-d2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d0b" />
      <stop offset="100%" stop-color="#141310" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-kon-d2)" />

  <g font-family="monospace" font-size="11" fill="#9b8e7e" letter-spacing="2">
    <text x="100" y="90">TABLE DISCOVERY &amp; SOMMELIER ARCHIVE</text>
  </g>

  <!-- Cellar and Atmosphere Visual Layout -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="300" height="480" fill="#151310" stroke="#2b251d" stroke-width="1.5" />
    <text x="30" y="50" font-family="monospace" font-size="10" fill="#0a5cff">SECTOR 01</text>
    <text x="30" y="80" font-family="sans-serif" font-size="18" fill="#eae4db">The Open Hearth</text>
    <text x="30" y="110" font-family="sans-serif" font-size="12" fill="#7d7264">Counter seating for 8 guests. Live wood-fire preparation.</text>

    <rect x="350" y="0" width="300" height="480" fill="#151310" stroke="#2b251d" stroke-width="1.5" />
    <text x="380" y="50" font-family="monospace" font-size="10" fill="#0a5cff">SECTOR 02</text>
    <text x="380" y="80" font-family="sans-serif" font-size="18" fill="#eae4db">The Greenhouse Alcove</text>
    <text x="380" y="110" font-family="sans-serif" font-size="12" fill="#7d7264">Individual banquettes overlooking the night herbarium.</text>

    <rect x="700" y="0" width="300" height="480" fill="#151310" stroke="#2b251d" stroke-width="1.5" />
    <text x="730" y="50" font-family="monospace" font-size="10" fill="#0a5cff">SECTOR 03</text>
    <text x="730" y="80" font-family="sans-serif" font-size="18" fill="#eae4db">Private Vault</text>
    <text x="730" y="110" font-family="sans-serif" font-size="12" fill="#7d7264">Up to 12 guests. Dedicated sommelier and bespoke menu.</text>
  </g>
</svg>
