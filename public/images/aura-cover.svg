<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1014" />
      <stop offset="50%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="glow-aura" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a5cff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a5cff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c212a" />
      <stop offset="100%" stop-color="#101318" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-aura)" />
  <rect width="1200" height="800" fill="url(#grid)" />
  
  <!-- Subtle lighting aura -->
  <circle cx="600" cy="280" r="320" fill="url(#glow-aura)" />

  <!-- Mountain Silhouette / Contours -->
  <path d="M 0 540 Q 280 430, 540 480 T 1000 390 L 1200 440 L 1200 800 L 0 800 Z" fill="url(#mountain-grad)" />
  <path d="M 0 600 Q 360 520, 680 570 T 1200 520 L 1200 800 L 0 800 Z" fill="#0d0f13" />

  <!-- Architectural Minimal Pavilion Structure -->
  <g transform="translate(420, 360)">
    <!-- Base platform -->
    <rect x="0" y="110" width="360" height="12" fill="#242a35" />
    <rect x="20" y="122" width="320" height="40" fill="#151920" />
    
    <!-- Floor-to-ceiling glass volume -->
    <rect x="30" y="30" width="300" height="80" fill="#0d1117" stroke="#2a3240" stroke-width="1.5" />
    <line x1="105" y1="30" x2="105" y2="110" stroke="#1f2633" stroke-width="1.5" />
    <line x1="180" y1="30" x2="180" y2="110" stroke="#1f2633" stroke-width="1.5" />
    <line x1="255" y1="30" x2="255" y2="110" stroke="#1f2633" stroke-width="1.5" />
    
    <!-- Warm interior light glow -->
    <rect x="35" y="35" width="65" height="70" fill="#e6d5b8" fill-opacity="0.12" />
    <rect x="185" y="35" width="65" height="70" fill="#e6d5b8" fill-opacity="0.18" />

    <!-- Overhanging cantilevered roof -->
    <polygon points="-20,30 380,30 360,20 0,20" fill="#2b3240" />
    <line x1="-20" y1="30" x2="380" y2="30" stroke="#0a5cff" stroke-width="1" stroke-opacity="0.6" />
  </g>

  <!-- Technical Overlay Elements -->
  <g font-family="monospace" font-size="11" fill="#8892b0" letter-spacing="2">
    <text x="60" y="70">AURA SANCTUARY // BOUTIQUE HOSP. CONCEPT</text>
    <text x="60" y="90" fill="#4d5b7c">LAT 45°58'N  LON 07°42'E — ALT 1,840M</text>
    <text x="1000" y="70" text-anchor="end">SPEC. EDITION 01</text>
    <text x="1000" y="90" text-anchor="end" fill="#0a5cff">STATUS: CONCEPT</text>
  </g>

  <!-- Precision Crosshairs -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1">
    <line x1="60" y1="740" x2="90" y2="740" />
    <line x1="75" y1="725" x2="75" y2="755" />
    <line x1="1110" y1="740" x2="1140" y2="740" />
    <line x1="1125" y1="725" x2="1125" y2="755" />
  </g>

  <g font-family="monospace" font-size="10" fill="#6c7893" letter-spacing="1">
    <text x="105" y="744">MONOLITH SUITE // 84 M² PRIVATE TERRACE</text>
    <text x="1100" y="744" text-anchor="end">ZYRVAE CASE STUDY</text>
  </g>
</svg>
