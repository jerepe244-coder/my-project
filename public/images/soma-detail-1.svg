<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="detail1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89d58" />
      <stop offset="100%" stop-color="#e8bf7a" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#detail1-bg)" />

  <!-- Perimeter Hairlines -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#1a202c" stroke-width="1" />
  <line x1="30" y1="90" x2="770" y2="90" stroke="#1a202c" stroke-width="1" />
  <line x1="420" y1="90" x2="420" y2="570" stroke="#1a202c" stroke-width="1" />

  <!-- Header -->
  <text x="50" y="65" fill="#f4f5f8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">SŌMA // BIOACTIVE INGREDIENT MATRIX</text>
  <text x="750" y="65" fill="#0a5cff" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="1">CATALOG DETAIL 01</text>

  <!-- Left Column: Molecular Specimen Breakdown -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="#0a5cff" font-family="monospace" font-size="9" letter-spacing="1.5">// ACTIVE PURITY PROFILE</text>

    <!-- Specimen Bars -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="10">Phyto-Peptide Matrix 4.8%</text>
      <text x="320" y="0" fill="#8b92a5" font-family="monospace" font-size="9" text-anchor="end">CELLULAR DENSITY</text>
      <rect x="0" y="10" width="320" height="4" fill="#141922" rx="2" />
      <rect x="0" y="10" width="280" height="4" fill="url(#amber-accent)" rx="2" />
    </g>

    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="10">Olive Squalane 100% Pure</text>
      <text x="320" y="0" fill="#8b92a5" font-family="monospace" font-size="9" text-anchor="end">LIPID SEAL</text>
      <rect x="0" y="10" width="320" height="4" fill="#141922" rx="2" />
      <rect x="0" y="10" width="320" height="4" fill="#0a5cff" rx="2" />
    </g>

    <g transform="translate(0, 130)">
      <text x="0" y="0" fill="#ffffff" font-family="monospace" font-size="10">Wild Terpenes &amp; Resins</text>
      <text x="320" y="0" fill="#8b92a5" font-family="monospace" font-size="9" text-anchor="end">SENSORY AROMA</text>
      <rect x="0" y="10" width="320" height="4" fill="#141922" rx="2" />
      <rect x="0" y="10" width="230" height="4" fill="#c89d58" rx="2" />
    </g>

    <!-- Lab Certification Card -->
    <rect x="0" y="180" width="320" height="180" rx="8" fill="#090c10" stroke="#1f2635" stroke-width="1" />
    <text x="20" y="215" fill="#8b92a5" font-family="monospace" font-size="9">// BOTANICAL INTEGRITY</text>
    <text x="20" y="240" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Biophotonic Glass Preservation</text>
    <text x="20" y="265" fill="#8b92a5" font-family="sans-serif" font-size="10">Violet glass filters harmful UV rays while letting healing</text>
    <text x="20" y="280" fill="#8b92a5" font-family="sans-serif" font-size="10">infrared and violet frequencies nourish active molecules.</text>
    <line x1="20" y1="305" x2="300" y2="305" stroke="#161b24" stroke-width="1" />
    <text x="20" y="330" fill="#0a5cff" font-family="monospace" font-size="9">E-COMMERCE DIRECT DISPATCH</text>
    <text x="300" y="330" fill="#515768" font-family="monospace" font-size="9" text-anchor="end">0% PLASTIC</text>
  </g>

  <!-- Right Column: Tactile Product Exploration View -->
  <g transform="translate(450, 130)">
    <text x="0" y="0" fill="#0a5cff" font-family="monospace" font-size="9" letter-spacing="1.5">// DIGITAL ATELIER SPECIMEN</text>

    <!-- Central Bottle Graphic Silhouette -->
    <g transform="translate(150, 150)">
      <rect x="-45" y="-90" width="90" height="180" rx="16" fill="#111620" stroke="#253044" stroke-width="1.5" />
      <rect x="-35" y="-20" width="70" height="90" fill="#080a0e" stroke="#1c2332" stroke-width="1" />
      <text x="0" y="15" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="2" text-anchor="middle">SŌMA</text>
      <text x="0" y="30" fill="#0a5cff" font-family="monospace" font-size="6" letter-spacing="1" text-anchor="middle">FORM-01</text>
      <line x1="-20" y1="42" x2="20" y2="42" stroke="#242c3c" stroke-width="0.75" />
      <text x="0" y="55" fill="#8b92a5" font-family="sans-serif" font-size="6" text-anchor="middle">30 ML</text>

      <rect x="-18" y="-120" width="36" height="30" fill="#1a202c" stroke="#2d3748" stroke-width="1" />
      <path d="M-14,-120 L-10,-150 Q-10,-165 0,-165 Q10,-165 10,-150 L14,-120 Z" fill="#101319" stroke="#2a3344" stroke-width="1" />

      <!-- Concentric Aura Rings -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#1f293d" stroke-width="0.75" stroke-dasharray="2,6" opacity="0.6" />
      <circle cx="0" cy="0" r="130" fill="none" stroke="#171f2e" stroke-width="0.5" opacity="0.4" />
    </g>

    <text x="150" y="350" fill="#515768" font-family="monospace" font-size="9" text-anchor="middle">PERSPECTIVE SPECIMEN 01 // 30ML FLUID</text>
  </g>
</svg>
